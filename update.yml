name: Обновяване на данните

on:
  schedule:
    - cron: "30 5 * * *"   # всеки ден в 05:30 UTC (07:30/08:30 българско време)
  workflow_dispatch:        # ръчно пускане от раздел Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
        timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Инсталиране
        run: pip install requests
      - name: Обновяване от Евростат
        run: python update.py
      - name: Запис на промените
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Няма промени."
          else
            git commit -m "Автоматично обновяване на данните $(date -u +%Y-%m-%d)"
            git push
          fi
